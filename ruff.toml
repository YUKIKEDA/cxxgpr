target-version = "py310"
line-length = 100
extend-exclude = ["./out", "./build", "./.agents", "./.claude"]

[lint]
select = [
    "E", "W", "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "PL",
    "FURB",
    "ISC",
    "PTH",
    "RUF",
]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "PLR2004",
    "RUF001", "RUF002", "RUF003",
]
