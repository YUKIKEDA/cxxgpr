name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "include/**"
      - "tools/docs/**"
      - "tools/qa/doc_api_coverage.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: build documentation sites and check API coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Install Sphinx toolchain
        run: python -m pip install -r docs/requirements.txt
      - name: Generate Doxygen XML and API reference pages
        run: |
          mkdir -p out/docs/doxygen
          doxygen docs/Doxyfile
          python tools/docs/gen_api_reference.py
      - name: Check API coverage (en, ja)
        run: python -X utf8 tools/qa/doc_api_coverage.py
      - name: Build English site
        run: python -m sphinx -b html -W --keep-going -c docs docs/en out/docs/html/en
      - name: Build Japanese site
        run: python -m sphinx -b html -W --keep-going -c docs -D language=ja docs/ja out/docs/html/ja
      - uses: actions/upload-artifact@v4
        with:
          name: cxxgpr-docs
          path: out/docs/html
